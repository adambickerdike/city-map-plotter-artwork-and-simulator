<title>Plot Simulator — City Map Plotter sample</title>
<style>
  :root {
    --surface: #16191c;
    --surface-2: #1e2226;
    --surface-3: #272c31;
    --edge: #333a40;
    --edge-soft: #2a3036;
    --text: #e6e9ec;
    --text-dim: #9aa4ac;
    --text-faint: #6b757d;
    --paper: #faf7f1;
    --paper-edge: #ddd6c8;
    --signal: #f0a02c;
    --signal-dim: #8a5d1a;
    --good: #5fbf8f;
    --warn: #e0674a;
    --shadow: rgba(0,0,0,.55);
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --surface: #d9d5cd; --surface-2: #e8e5df; --surface-3: #f1efea;
      --edge: #bdb8ae; --edge-soft: #cbc7bd;
      --text: #1d2124; --text-dim: #5a6167; --text-faint: #868d93;
      --paper: #fffdf8; --paper-edge: #c9c2b4;
      --signal: #b0700c; --signal-dim: #d8b273;
      --good: #2c7f57; --warn: #b4442a;
      --shadow: rgba(60,52,40,.28);
    }
  }
  :root[data-theme="dark"] {
    --surface: #16191c; --surface-2: #1e2226; --surface-3: #272c31;
    --edge: #333a40; --edge-soft: #2a3036;
    --text: #e6e9ec; --text-dim: #9aa4ac; --text-faint: #6b757d;
    --paper: #faf7f1; --paper-edge: #ddd6c8;
    --signal: #f0a02c; --signal-dim: #8a5d1a;
    --good: #5fbf8f; --warn: #e0674a; --shadow: rgba(0,0,0,.55);
  }
  :root[data-theme="light"] {
    --surface: #d9d5cd; --surface-2: #e8e5df; --surface-3: #f1efea;
    --edge: #bdb8ae; --edge-soft: #cbc7bd;
    --text: #1d2124; --text-dim: #5a6167; --text-faint: #868d93;
    --paper: #fffdf8; --paper-edge: #c9c2b4;
    --signal: #b0700c; --signal-dim: #d8b273;
    --good: #2c7f57; --warn: #b4442a; --shadow: rgba(60,52,40,.28);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--surface); color: var(--text);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; min-height: 100vh; }

  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--edge);
    background: var(--surface-2);
  }
  h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .eyebrow {
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--text-faint);
  }
  header .spec { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

  main { display: grid; grid-template-columns: minmax(0,1fr) 296px; flex: 1; min-height: 0; }
  @media (max-width: 860px) { main { grid-template-columns: minmax(0,1fr); } }

  .stage {
    position: relative; display: grid; place-items: center;
    padding: 24px; min-height: 440px;
    background:
      radial-gradient(ellipse at 50% 0%, var(--surface-2), var(--surface) 70%);
  }
  canvas { display: block; border-radius: 2px; box-shadow: 0 18px 44px -12px var(--shadow); }

  .badge {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%) scale(.96);
    display: flex; flex-direction: column; gap: 11px; min-width: 200px;
    padding: 16px 20px; border-radius: 4px;
    background: var(--surface-3); border: 1px solid var(--edge);
    box-shadow: 0 14px 40px -10px var(--shadow);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .badge.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .badge .row {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--mono); font-size: 12px; letter-spacing: .05em;
  }
  .badge .swatch { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(128,128,128,.5); }
  .badge .bar { height: 3px; background: var(--edge); border-radius: 2px; overflow: hidden; }
  .badge .bar i { display: block; height: 100%; background: var(--signal); width: 0; }

  .rail {
    border-left: 1px solid var(--edge); background: var(--surface-2);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  @media (max-width: 860px) { .rail { border-left: 0; border-top: 1px solid var(--edge); } }
  .panel { padding: 16px 18px; border-bottom: 1px solid var(--edge-soft); }
  .panel h2 {
    margin: 0 0 12px; font-family: var(--mono); font-size: 10px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--text-faint); font-weight: 500;
  }

  .clock { font-family: var(--mono); font-size: 30px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .clock .of { color: var(--text-faint); font-size: 15px; }

  .pens { display: flex; flex-direction: column; gap: 3px; }
  .pen {
    display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px;
    padding: 7px 9px; border-radius: 3px; border: 1px solid transparent;
    font-size: 12.5px; color: var(--text-dim); transition: background .2s, color .2s;
  }
  .pen.active { background: var(--surface-3); border-color: var(--edge); color: var(--text); }
  .pen.done { color: var(--text-faint); }
  .pen .dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid rgba(128,128,128,.45); }
  .pen .n { font-family: var(--mono); font-size: 11px; font-variant-numeric: tabular-nums; }
  .pen .bar { grid-column: 2 / -1; height: 2px; background: var(--edge); border-radius: 1px; overflow: hidden; }
  .pen .bar i { display: block; height: 100%; background: var(--signal); width: 0; }

  dl.stats { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin: 0; }
  dl.stats dt { color: var(--text-dim); font-size: 12.5px; }
  dl.stats dd {
    margin: 0; font-family: var(--mono); font-size: 12.5px;
    font-variant-numeric: tabular-nums; text-align: right;
  }
  dd .delta { color: var(--good); font-size: 11px; }

  .transport {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 12px 20px; border-top: 1px solid var(--edge); background: var(--surface-2);
  }
  button, .seg {
    font-family: var(--sans); font-size: 12.5px; color: var(--text);
    background: var(--surface-3); border: 1px solid var(--edge);
    border-radius: 3px; cursor: pointer;
  }
  button { padding: 7px 15px; transition: border-color .15s, background .15s; }
  button:hover { border-color: var(--text-faint); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
  button.primary { background: var(--signal); border-color: var(--signal); color: #16120a; font-weight: 600; min-width: 82px; }
  .seg { display: flex; padding: 2px; gap: 2px; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; font-family: var(--mono); font-size: 11px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--signal); }

  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--signal); }
  label.check { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
  .tlabel { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-faint); }
  @media (prefers-reduced-motion: reduce) { .badge { transition: none; } }
</style>

<div class="app">
  <header>
    <div>
      <div class="eyebrow">Pen plot simulator</div>
      <h1>City Map Plotter sample</h1>
    </div>
    <div class="spec" id="spec"></div>
  </header>

  <main>
    <div class="stage">
      <canvas id="c"></canvas>
      <div class="badge" id="badge">
        <div class="row">
          <span class="swatch" id="badgeSwatch"></span>
          <span id="badgeText">Load pen</span>
        </div>
        <div class="bar"><i id="badgeBar"></i></div>
      </div>
    </div>

    <aside class="rail">
      <div class="panel">
        <h2>Elapsed</h2>
        <div class="clock"><span id="tNow">0:00</span> <span class="of" id="tTotal"></span></div>
      </div>
      <div class="panel">
        <h2>Pen sequence</h2>
        <div class="pens" id="pens"></div>
      </div>
      <div class="panel">
        <h2>This run</h2>
        <dl class="stats" id="stats"></dl>
      </div>
      <div class="panel">
        <h2>Ordering</h2>
        <dl class="stats" id="compare"></dl>
      </div>
    </aside>
  </main>

  <div class="transport">
    <button class="primary" id="play">Play</button>
    <button id="restart">Restart</button>
    <span class="tlabel">Speed</span>
    <div class="seg" id="speed"></div>
    <span class="tlabel">Order</span>
    <div class="seg" id="order"></div>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub through the plot">
    <label class="check"><input type="checkbox" id="travel" checked> Show pen-up travel</label>
  </div>
</div>

    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      if (ct[i] <= local) out.push(pts[i]); else { out.push(pointAt(move, t)); break; }
    }
    return out;
  }

  function trace(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.stroke();
  }

  function draw() {
    const data = tl(), page = data.page, t = state.t;
    ctx.clearRect(0, 0, page.width, page.height);

    const css = getComputedStyle(document.documentElement);
    ctx.fillStyle = css.getPropertyValue("--paper").trim() || "#faf7f1";
    ctx.fillRect(0, 0, page.width, page.height);
    ctx.strokeStyle = css.getPropertyValue("--paper-edge").trim() || "#ddd";
    ctx.lineWidth = 0.3; ctx.strokeRect(0.15, 0.15, page.width - 0.3, page.height - 0.3);

    ctx.lineCap = "round"; ctx.lineJoin = "round";
    let head = null, activePen = -1, changeMove = null;

    if (state.travel) {
      ctx.save();
      ctx.setLineDash([1.1, 1.4]); ctx.lineWidth = 0.12;
      ctx.strokeStyle = css.getPropertyValue("--text-faint").trim() || "#888";
      ctx.globalAlpha = 0.5;
      for (const m of data.moves) {
        if (m.k !== "t" || m.t > t) continue;
        trace(m.t + m.d <= t ? m.pts : partial(m, t));
      }
      ctx.restore();
    }

    for (const m of data.moves) {
      if (m.t > t) break;
      activePen = m.p;
      if (m.k === "p") {
        if (m.d > 0 && m.t + m.d > t) { changeMove = m; head = m.pts[0]; }
        continue;
      }
      if (m.k !== "d") { if (m.t + m.d > t) head = pointAt(m, t); continue; }
      const pen = data.pens[m.p];
      ctx.strokeStyle = pen.colour;
      ctx.lineWidth = Math.max(pen.nib_mm, 0.12);
      if (m.t + m.d <= t) { trace(m.pts); }
      else { trace(partial(m, t)); head = pointAt(m, t); }
    }

    if (head) {
      const r = 1.9 / 1;
      ctx.save();
      ctx.strokeStyle = css.getPropertyValue("--signal").trim() || "#f0a02c";
      ctx.lineWidth = 0.35;
      ctx.beginPath(); ctx.arc(head[0], head[1], r, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(head[0] - r * 2.1, head[1]); ctx.lineTo(head[0] - r * 0.7, head[1]);
      ctx.moveTo(head[0] + r * 0.7, head[1]); ctx.lineTo(head[0] + r * 2.1, head[1]);
      ctx.moveTo(head[0], head[1] - r * 2.1); ctx.lineTo(head[0], head[1] - r * 0.7);
      ctx.moveTo(head[0], head[1] + r * 0.7); ctx.lineTo(head[0], head[1] + r * 2.1);
      ctx.stroke();
      ctx.restore();
    }
    updateRail(activePen, changeMove);
  }

  function updateRail(activePen, changeMove) {
    const data = tl();
    document.getElementById("tNow").textContent = fmt(state.t);
    document.getElementById("tTotal").textContent = "/ " + fmt(data.stats.total_seconds);

    const badge = document.getElementById("badge");
    badge.classList.toggle("on", !!changeMove);
    if (changeMove) {
      const pen = data.pens[changeMove.p];
      const left = Math.ceil(changeMove.t + changeMove.d - state.t);
      document.getElementById("badgeSwatch").style.background = pen.colour;
      document.getElementById("badgeText").textContent = "Load " + pen.pen + " — " + left + "s";
      const f = (state.t - changeMove.t) / (changeMove.d || 1);
      document.getElementById("badgeBar").style.width =
        (Math.min(1, Math.max(0, f)) * 100).toFixed(1) + "%";
    }

    document.querySelectorAll(".pen").forEach((node, i) => {
      node.classList.toggle("active", i === activePen);
      node.classList.toggle("done", i < activePen);
      const done = data.penTime[i];
      const f = Math.min(1, Math.max(0, (state.t - done.start) / (done.end - done.start || 1)));
      node.querySelector("i").style.width = (f * 100).toFixed(1) + "%";
    });
  }

  function buildRail() {
    const data = tl();
    document.getElementById("spec").textContent =
      data.page.width + " × " + data.page.height + " mm  ·  " + data.machine.name +
      "  ·  " + data.machine.pen_down_speed_mm_s + " mm/s down";

    document.getElementById("pens").innerHTML = data.pens.map((p, i) => `
      <div class="pen">
        <span class="dot" style="background:${p.colour}"></span>
        <span>${p.pen}</span>
        <span class="n">${data.penStrokes[i]}</span>
        <span class="bar"><i></i></span>
      </div>`).join("");

    const s = data.stats;
    document.getElementById("stats").innerHTML = `
      <dt>Drawing</dt><dd>${(s.pen_down_mm / 1000).toFixed(2)} m</dd>
      <dt>Travel (pen up)</dt><dd>${(s.pen_up_mm / 1000).toFixed(2)} m</dd>
      <dt>Travel ratio</dt><dd>${s.travel_ratio.toFixed(2)}×</dd>
      <dt>Pen lifts</dt><dd>${s.pen_lifts}</dd>
      <dt>Pen changes</dt><dd>${s.pen_changes}</dd>`;

    const doc = DATA.document.stats, opt = DATA.optimised.stats;
    const saved = doc.total_seconds - opt.total_seconds;
    document.getElementById("compare").innerHTML = `
      <dt>Document order</dt><dd>${fmt(doc.total_seconds)}</dd>
      <dt>Optimised</dt><dd>${fmt(opt.total_seconds)} <span class="delta">−${fmt(saved)}</span></dd>
      <dt>Travel saved</dt><dd class="delta">${(100 * (1 - opt.pen_up_mm / doc.pen_up_mm)).toFixed(0)}%</dd>`;
  }

  function tick(now) {
    if (state.playing) {
      const dt = lastFrame ? (now - lastFrame) / 1000 : 0;
      state.t += dt * state.speed;
      if (state.t >= tl().stats.total_seconds) { state.t = tl().stats.total_seconds; setPlaying(false); }
      document.getElementById("scrub").value = String(1000 * state.t / tl().stats.total_seconds);
      draw();
    }
    lastFrame = now;
    requestAnimationFrame(tick);
  }

  function setPlaying(on) {
    state.playing = on;
    document.getElementById("play").textContent = on ? "Pause" : "Play";
  }

  function segment(id, values, current, onPick, label) {
    const host = document.getElementById(id);
    host.innerHTML = values.map(v =>
      `<button data-v="${v}" aria-pressed="${v === current}">${label(v)}</button>`).join("");
    host.addEventListener("click", (e) => {
      const button = e.target.closest("button"); if (!button) return;
      const raw = button.dataset.v;
      onPick(isNaN(Number(raw)) ? raw : Number(raw));
      host.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b === button));
    });
  }

  segment("speed", [1, 4, 16, 64], state.speed, v => state.speed = v, v => v + "×");
  segment("order", ["document", "optimised"], state.order, v => {
    state.order = v; state.t = 0;
    document.getElementById("scrub").value = "0";
    buildRail(); draw();
  }, v => v === "document" ? "As written" : "Optimised");

  document.getElementById("play").addEventListener("click", () => {
    if (state.t >= tl().stats.total_seconds) state.t = 0;
    setPlaying(!state.playing);
  });
  document.getElementById("restart").addEventListener("click", () => {
    state.t = 0; document.getElementById("scrub").value = "0"; draw();
  });
  document.getElementById("scrub").addEventListener("input", (e) => {
    state.t = tl().stats.total_seconds * Number(e.target.value) / 1000; draw();
  });
  document.getElementById("travel").addEventListener("change", (e) => {
    state.travel = e.target.checked; draw();
  });
  window.addEventListener("resize", fit);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  buildRail(); fit(); requestAnimationFrame(tick);
})();
</script>
